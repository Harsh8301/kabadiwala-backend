<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kabadiwala Connect Admin</title>
<style>
body{font:15px system-ui,sans-serif;margin:0;color:#152b25;background:#f3f7f4}header{background:#123e32;color:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:23px}button,input,select{font:inherit;padding:10px;border:1px solid #b9cdc4;border-radius:8px}button{background:#176348;color:white;cursor:pointer}button:disabled{opacity:.5}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}nav button{background:white;color:#176348}.card{background:white;border:1px solid #d5e2d9;border-radius:12px;padding:18px;margin:12px 0;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.grid .card{margin:0}.label{color:#49665a;font-size:13px}strong{font-size:20px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:9px;border-bottom:1px solid #e4ebe6;text-align:left;vertical-align:top}td{max-width:230px;overflow-wrap:anywhere}#error{color:#ac2333;min-height:22px}
</style></head><body><header><b>Kabadiwala Connect · Admin</b><button id="logout" hidden>Sign out</button></header><main>
<section id="login"><h1>Administrator sign in</h1><div class="card"><form id="form"><p><input id="email" type="email" placeholder="Email" required autocomplete="username"></p><p><input id="password" type="password" placeholder="Password" required autocomplete="current-password"></p><button>Sign in</button></form></div></section>
<section id="app" hidden><h1 id="title">Dashboard</h1><nav id="nav"></nav><div id="content"></div><div class="card"><label for="dataset">Dataset export</label> <select id="dataset"><option>materials</option><option>prices</option><option>transactions</option><option>transfers</option><option>traceability</option><option>buyers</option><option>feedback</option><option>recyclers</option><option>recycling</option></select> <button id="json">JSON</button> <button id="csv">CSV</button></div></section><p id="error" role="alert"></p></main>
<script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('adminToken')||'';
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(resource,method='GET',body,extra=''){
 const response=await fetch(`/marketplace?resource=${resource}${extra}`,{method,headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:body?JSON.stringify(body):undefined});
 const result=await response.json();if(!response.ok)throw Error(result.error||'Request failed');return result.data;
}
const modules=['dashboard','users','roles','recyclers','categories','materials','prices','lots','batches','offers','transactions','handovers','payments','disputes','traceability','recycling','feedback','knowledge','audit','datasets'];
const forms={categories:['category','id','name'],materials:['material','id','category','subcategory','description'],prices:['price','materialId','location','rate'],knowledge:['knowledge','materialId','guidance']};
function show(){ $('login').hidden=!!token;$('app').hidden=!token;$('logout').hidden=!token; }
function cells(row){return Object.values(row).map(v=>`<td>${escapeHtml(typeof v==='object'?JSON.stringify(v):v)}</td>`).join('');}
async function openModule(kind){$('error').textContent='';$('title').textContent=kind[0].toUpperCase()+kind.slice(1);try{
 const data=await api('admin','GET',null,`&kind=${kind}`);
 if(kind==='dashboard'){$('content').innerHTML='<div class="grid">'+Object.entries({...data.roles,...data}).filter(([key])=>key!=='roles').map(([key,value])=>`<div class="card"><div class="label">${escapeHtml(key.replaceAll('_',' '))}</div><strong>${escapeHtml(value)}</strong></div>`).join('')+'</div>';return;}
 if(kind==='datasets'){$('content').innerHTML=`<div class="card">Available exports: ${data.map(escapeHtml).join(', ')}. Choose a dataset and format below.</div>`;return;}
 const rows=Array.isArray(data)?data:[];
 $('content').innerHTML=`<div class="card">${rows.length?`<table><thead><tr>${Object.keys(rows[0]).map(k=>`<th>${escapeHtml(k)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cells(r)}</tr>`).join('')}</tbody></table>`:'No records'}</div>`;
 if(['users','recyclers'].includes(kind))$('content').insertAdjacentHTML('beforeend','<div class="card"><h2>Recycler verification</h2><input id="recyclerId" placeholder="Recycler UUID"><select id="verification"><option>VERIFIED</option><option>REJECTED</option><option>UNVERIFIED</option></select><button id="verify">Update</button></div>');
 if(['users','recyclers'].includes(kind))$('verify').onclick=async()=>{try{await api('admin','PATCH',{id:$('recyclerId').value,status:$('verification').value},'&action=verify-recycler');openModule(kind)}catch(e){$('error').textContent=e.message}};
 if(['users','roles'].includes(kind))$('content').insertAdjacentHTML('beforeend','<div class="card"><h2>Assign role</h2><input id="roleUserId" placeholder="User UUID"><select id="roleValue"><option>COLLECTOR</option><option>AGGREGATOR</option><option>MIDDLEMAN</option><option>RECYCLER</option></select><button id="setRole">Update</button></div>');
 if(['users','roles'].includes(kind))$('setRole').onclick=async()=>{try{await api('admin','PATCH',{id:$('roleUserId').value,role:$('roleValue').value},'&action=set-role');openModule(kind)}catch(e){$('error').textContent=e.message}};
 if(kind==='disputes')$('content').insertAdjacentHTML('beforeend','<div class="card"><h2>Resolve dispute</h2><p><input id="disputeId" placeholder="Dispute UUID"><select id="disputeStatus"><option>UNDER_REVIEW</option><option>RESOLVED</option><option>REJECTED</option></select></p><p><input id="resolution" placeholder="Resolution"><input id="finalWeight" type="number" step="any" placeholder="Final weight (optional)"><input id="finalRate" type="number" step="any" placeholder="Final rate (optional)"></p><button id="resolve">Update</button></div>');
 if(kind==='disputes')$('resolve').onclick=async()=>{try{await api('disputes','PATCH',{id:$('disputeId').value,status:$('disputeStatus').value,adminResolution:$('resolution').value,...($('finalWeight').value?{finalWeightKg:Number($('finalWeight').value)}:{}),...($('finalRate').value?{finalRate:Number($('finalRate').value)}:{})});openModule('disputes')}catch(e){$('error').textContent=e.message}};
 if(forms[kind]){const [action,...fields]=forms[kind];$('content').insertAdjacentHTML('beforeend',`<form class="card" id="create"><h2>Add ${escapeHtml(kind)}</h2>${fields.map(k=>`<p><label>${escapeHtml(k)} <input name="${escapeHtml(k)}" required></label></p>`).join('')}<button>Create</button></form>`);
   $('create').onsubmit=async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(event.target).entries());try{await api('admin','POST',values,`&action=${action}`);openModule(kind)}catch(error){$('error').textContent=error.message}};}
 }catch(error){$('error').textContent=error.message;}}
$('nav').innerHTML=modules.map(k=>`<button data-module="${k}">${k}</button>`).join('');
$('nav').onclick=e=>{const kind=e.target.dataset.module;if(kind)openModule(kind)};
$('form').onsubmit=async e=>{e.preventDefault();try{const result=await api('auth','POST',{email:$('email').value,password:$('password').value},'&action=login');token=result.token;sessionStorage.setItem('adminToken',token);const me=await api('me');if(me.role!=='ADMIN')throw Error('Admin account required');show();openModule('dashboard')}catch(error){token='';sessionStorage.removeItem('adminToken');$('error').textContent=error.message}};
$('logout').onclick=()=>{token='';sessionStorage.removeItem('adminToken');show()};
function csvValue(v){const s=typeof v==='object'?JSON.stringify(v):String(v??'');return '"'+s.replaceAll('"','""')+'"'}
async function download(format){try{const result=await api('export','GET',null,`&kind=${$('dataset').value}`);const rows=result.rows;const content=format==='json'?JSON.stringify(rows,null,2):rows.length?[Object.keys(rows[0]).map(csvValue).join(','),...rows.map(r=>Object.values(r).map(csvValue).join(','))].join('\r\n'):'';const blob=new Blob([content],{type:format==='json'?'application/json':'text/csv'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`${result.dataset}.${format}`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(error){$('error').textContent=error.message}}
$('json').onclick=()=>download('json');$('csv').onclick=()=>download('csv');show();if(token)openModule('dashboard');
</script></body></html>
